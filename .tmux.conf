set-option -g prefix C-s
set-option -g status-position top

set -g history-limit 20000
set-option -sg escape-time 10
set-option -sg repeat-time 300
set-option -g focus-events on
set -g set-clipboard on
# set-option -g default-terminal "screen-256color"
# # set-option -g default-terminal 'xterm-256color'
set-option -as terminal-features ',xterm-256color:RGB'
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",*:clipboard"
# set-option -ga terminal-overrides 'xterm-256color:Ms=\E]52;%p1%s;%p2%s\a'
set-option -g terminal-overrides 'xterm-256color:Ms=\033]52;%p1%s;%p2%s\033\\'
set-window-option -g mode-keys vi
set -g mouse on
# allows sixel
set-option -as terminal-features ',xterm-256color:sixel'

bind-key -rT prefix C-h resize-pane -L 5
bind-key -rT prefix C-j resize-pane -D 5
bind-key -rT prefix C-k resize-pane -U 5
bind-key -rT prefix C-l resize-pane -R 6
bind-key -rn C-y next-window

bind-key -T prefix h select-pane -L
bind-key -T prefix j select-pane -D
bind-key -T prefix k select-pane -U
bind-key -T prefix m select-pane -U
bind-key -T prefix l select-pane -R

